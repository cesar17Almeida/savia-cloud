{% extends "base.html" %}
{% block title %}Cambiar contraseña — Savia Cloud{% endblock %}
{% block content %}
<h1>Cambiar contraseña</h1>
<section class="card narrow">
  <form method="post">
    <label>Contraseña actual
      <input name="current" type="password" autocomplete="current-password" autofocus>
    </label>
    <label>Nueva contraseña
      <input name="new" type="password" autocomplete="new-password">
    </label>
    <button type="submit" class="primary">Actualizar</button>
  </form>
</section>
{% endblock %}
