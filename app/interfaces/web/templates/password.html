{% extends "base.html" %}
{% import "_icons.html" as i %}
{% block title %}Cambiar contraseña — Savia Cloud{% endblock %}
{% block content %}
<div class="page-head">
  <div class="titles">
    <h1>Cambiar contraseña</h1>
    <p class="sub">Vale para el panel y para la API: es la misma cuenta.</p>
  </div>
</div>
<section class="card narrow reveal">
  <form method="post">
    <label>Contraseña actual
      <input name="current" type="password" autocomplete="current-password" autofocus>
    </label>
    <label style="margin-top: 0.85rem">Nueva contraseña
      <input name="new" type="password" autocomplete="new-password" minlength="8" required>
      <span class="hint">Mínimo 8 caracteres; no puede ser la contraseña por defecto.</span>
    </label>
    <div class="form-actions">
      <button type="submit" class="primary">{{ i.ico("key") }}Actualizar</button>
    </div>
  </form>
</section>
{% endblock %}
