{# Inline icon set: one stroke weight, one 24x24 box, currentColor. Kept in the
   templates rather than as files so an icon never costs a request. #}

<path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/>

<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>
