<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Savia Cloud{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('web.static', filename='panel.css') }}">
</head>
<body>
<header class="appbar">
  <a class="brand" href="{{ url_for('web.dashboard') }}">SAVIA<span>cloud</span></a>
  <form method="post" action="{{ url_for('web.logout') }}" class="inline">
    <button type="submit" class="ghost">Cerrar sesión</button>
  </form>
</header>
<div class="shell">
  <aside class="sidenav">
    <nav>
      <a class="nav-item {{ 'is-active' if nav_active == 'stations' }}"
         href="{{ url_for('web.dashboard') }}"
         {{ 'aria-current=page' if nav_active == 'stations' }}>Estaciones</a>
      <a class="nav-item {{ 'is-active' if nav_active == 'password' }}"
         href="{{ url_for('web.password') }}"
         {{ 'aria-current=page' if nav_active == 'password' }}>Contraseña</a>
    </nav>
  </aside>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="toasts" id="toasts" role="status" aria-live="polite">
        {% for cat, msg in messages %}
          <div class="toast toast-{{ cat }}">
            <span>{{ msg }}</span>
            <button type="button" class="toast-x" aria-label="Descartar">&times;</button>
          </div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}
  <main>
    {% block content %}{% endblock %}
  </main>
</div>
<script>
// Toasts: errors stay until dismissed, confirmations fade on their own.
(function () {
  var box = document.getElementById("toasts");
  if (!box) return;
  box.addEventListener("click", function (ev) {
    var x = ev.target.closest(".toast-x");
    if (x) x.parentElement.remove();
  });
  box.querySelectorAll(".toast-ok").forEach(function (t) {
    setTimeout(function () { t.remove(); }, 8000);
  });
})();
</script>
</body>
</html>
